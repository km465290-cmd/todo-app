<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="app-header">
            <div>
                <h1>My Tasks</h1>
                <p>Stay organized and get things done.</p>
            </div>

            <button id="themeToggle" class="theme-toggle" type="button">
                🌙
            </button>
        </header>


        <!-- Task Input -->
        <section class="task-input-section">

            <div class="task-input-row">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                >

                <button id="addTaskBtn" type="button">
                    Add Task
                </button>

            </div>


            <div class="task-options">

                <div class="form-group">
                    <label for="prioritySelect">Priority</label>

                    <select id="prioritySelect">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="dueDate">Due Date</label>

                    <input
                        type="date"
                        id="dueDate"
                    >
                </div>


                <div class="form-group">
                    <label for="categoryInput">Category</label>

                    <input
                        type="text"
                        id="categoryInput"
                        placeholder="e.g. Study"
                    >
                </div>

            </div>

        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <span class="stat-label">Total Tasks</span>
                <strong id="totalCount">0</strong>
            </div>

            <div class="stat-card">
                <span class="stat-label">Completed</span>
                <strong id="completedCount">0</strong>
            </div>

            <div class="stat-card">
                <span class="stat-label">Active</span>
                <strong id="activeCount">0</strong>
            </div>

        </section>


        <!-- Controls -->
        <section class="controls">

            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-filter="all"
                    type="button"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="active"
                    type="button"
                >
                    Active
                </button>

                <button
                    class="filter-btn"
                    data-filter="completed"
                    type="button"
                >
                    Completed
                </button>

            </div>


            <div class="search-section">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search tasks..."
                    autocomplete="off"
                >

            </div>

        </section>


        <!-- Task List -->
        <main>

            <div id="taskList" class="task-list">
            </div>


            <!-- Empty State -->
            <div id="emptyState" class="empty-state">

                <div class="empty-icon">✓</div>

                <h2>No tasks found</h2>

                <p>
                    Add a task to start organizing your day.
                </p>

            </div>

        </main>


        <!-- Footer -->
        <footer class="app-footer">

            <span id="taskSummary">
                0 tasks
            </span>

            <button
                id="clearCompletedBtn"
                type="button"
            >
                Clear Completed
            </button>

        </footer>

    </div>


    <!-- Edit Task Modal -->
    <div id="editModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <div>
                    <h2>Edit Task</h2>
                    <p>Update your task details.</p>
                </div>

                <button
                    id="closeModalBtn"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div class="modal-form">

                <div class="form-group">

                    <label for="editTaskInput">
                        Task
                    </label>

                    <input
                        type="text"
                        id="editTaskInput"
                        placeholder="Task name"
                    >

                </div>


                <div class="modal-grid">

                    <div class="form-group">

                        <label for="editPriority">
                            Priority
                        </label>

                        <select id="editPriority">

                            <option value="low">
                                Low
                            </option>

                            <option value="medium">
                                Medium
                            </option>

                            <option value="high">
                                High
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="editDueDate">
                            Due Date
                        </label>

                        <input
                            type="date"
                            id="editDueDate"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="editCategory">
                        Category
                    </label>

                    <input
                        type="text"
                        id="editCategory"
                        placeholder="e.g. College"
                    >

                </div>

            </div>


            <div class="modal-actions">

                <button
                    id="cancelEditBtn"
                    class="cancel-btn"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="saveEditBtn"
                    class="save-btn"
                    type="button"
                >
                    Save Changes
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
